[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "article3-multiscale"
version = "0.1.0"
description = "Goal-gated provenance scaffolding for Article 3 multiscale transfer"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
cache_dir = ".pytest_cache"
pythonpath = ["src"]
